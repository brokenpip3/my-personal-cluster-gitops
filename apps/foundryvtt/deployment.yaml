apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundryvtt
  namespace: foundryvtt
  labels:
    app: foundryvtt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: foundryvtt
  template:
    metadata:
      labels:
        app: foundryvtt
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: mkdir
        image: docker.io/library/busybox:1.38.0
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -c
        - |
          mkdir -p /data
          chown -R 2000:2000 /data
          chmod -R 755 /data
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: foundryvtt
        image: 172.26.10.10:5000/foundryvtt:14.367
        securityContext:
          runAsUser: 2000
          runAsGroup: 2000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 30000
          name: http
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
          limits:
            memory: "1Gi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: foundryvtt-data
